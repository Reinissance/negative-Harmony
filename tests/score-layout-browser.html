<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>body{background:#eee;color:#111;margin:12px}#result{white-space:pre-wrap}#scoreContainer{display:block!important;padding:12px;max-width:360px;background:white}</style>
<pre id="result">Running score layout and timing checks…</pre>
<div style="display:flex;justify-content:center"><div id="scoreContainer"><div id="score"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.5.1/abcjs-basic-min.min.js"></script>
<script src="https://unpkg.com/@tonejs/midi@2.0.24"></script>
<script src="tests/midi-fixture.js"></script>
<script src="src/virtual-score.js"></script>
<script src="src/score-manager.js"></script>
<script src="src/transport.js"></script>
<script>
window.done = (async () => {
    const check = (v, msg) => { if (!v) throw Error(msg); };
    const pause = () => new Promise(r => setTimeout(r, 150));
    const result = document.getElementById('result');
    try {
        const app = {state:{speed:1},modules:{},track_duration:100};
        const manager = app.modules.scoreManager = new ScoreManager(app);
        manager.abcjs = ABCJS;
        manager.scoreShown = true;
        manager.showAbcErrorNotification = msg => { throw Error(msg); };
        const midi = new Midi(orchestralMidi(1, 80).toArray());
        midi.tracks[0].instrument.number = 40;
        midi.tracks[0].name = '';
        midi.header.tempos = [{ticks:0,bpm:90}, {ticks:3840,bpm:120}];
        midi.header.update();
        Transport.prototype.applyManualShiftToMidi.call({}, midi, 240);
        check(midi.header.tempos[0].ticks === 0, 'Initial tempo moved');
        check(Math.abs(midi.tracks[0].notes[0].time - 1/3) < .001, 'Shifted MIDI timing wrong');
        await manager.generateABCStringfromMIDI(midi, [4,4], 0);
        check(/nm="violin"/i.test(manager.abcString), 'Missing General MIDI name');
        manager.renderScore();
        await pause();
        const view = manager.virtualScore;
        const firstNote = view.mounted.get(0).events.find(e =>
            e.elements?.flat(Infinity).some(el => el.classList?.contains('abcjs-note')));
        check(firstNote, 'No rendered note event');
        check(Math.abs(firstNote.milliseconds - 1000/3) < 3,
            `Shifted score starts at ${firstNote.milliseconds}ms, expected 333ms`);
        view.follow(firstNote.milliseconds + 1);
        check(manager.highlightedElements.some(el => el.classList?.contains('abcjs-note')), 'Shift highlight missing');
        const score = document.getElementById('score');
        const expected = Math.max(0, (firstNote.left + firstNote.width/2) - score.clientWidth/2);
        check(Math.abs(score.scrollLeft - expected) < 3, 'Follower not centered on actual note');
        check(document.documentElement.scrollWidth <= innerWidth + 1, 'Page overflows horizontally');
        const later = view.index.abc(1);
        check(/nm="violi"/i.test(later) && !/nm="violin"/i.test(later), 'Later section has long name');
        const item = view.mounted.get(0);
        const svg = item.node.querySelector('svg');
        check(Math.abs(svg.getBoundingClientRect().width - view.sectionWidth(0)) < 3, 'Section width does not match its SVG');
        check(svg.getBBox().width * item.scale > view.sectionWidth(0) * .9, 'Section contains excessive blank canvas');
        check(parseFloat(view.mounted.get(1).node.style.left) === view.sectionWidth(0), 'Adjacent sections have a gap');
        result.textContent = 'PASS: mobile width, note-centered following, short labels, General MIDI names, and shifted-note timing.';
    } catch(error) { result.textContent = 'FAIL: ' + error.stack; }
    return result.textContent;
})();
</script>
